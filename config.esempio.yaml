# Configurazione autofatture - copiare in config.yaml (che NON va su GitHub) e compilare.
# Le credenziali NON vanno qui: si salvano con IMPOSTA_CREDENZIALI.bat.
# Un cliente con campi DA_COMPLETARE viene bloccato finché non si completa.

# simulazione = prova completa senza invio allo SDI (predefinita)
# ade         = caricamento reale sul portale Fatture e Corrispettivi
modalita: simulazione

percorsi:
  coda: '\\192.168.50.254\Pubblica\AUTOFATTURE\CODA'
  lavoro: '\\192.168.50.254\Pubblica\AUTOFATTURE\LAVORO'
  errori: '\\192.168.50.254\Pubblica\AUTOFATTURE\ERRORI'
  registro: '\\192.168.50.254\Pubblica\AUTOFATTURE\registro_autofatture.csv'
  diario: '\\192.168.50.254\Pubblica\AUTOFATTURE\LOG\autofatture.log'
  clienti_radice: '\\192.168.50.254\Pubblica\CLIENTI'

# Cartella di archivio del PDF originale, sotto clienti_radice.
cartella_cliente: '{cartella}\{anno}\Contabilità\IVA\Autofatture'

# Numero documento predefinito; ogni cliente può avere il suo formato_numero.
# {n} = progressivo AF, {aa} = anno a 2 cifre, {anno} = anno a 4 cifre.
formato_numero: "{n}/AF"

# Oltre questo totale (imponibile + IVA) niente invio automatico: task Todoist.
soglia_importo_eur: 20000

todoist:
  progetto_id: ""   # id del progetto "Autofatture"

email:
  mittente: info@studiorota.eu
  destinatari: [info@studiorota.eu]
  smtp_host: smtp.office365.com
  smtp_porta: 587

# Solo questi clienti possono avere autofatture: ogni altra P.IVA viene bloccata.
# id_trasmittente: P.IVA per le società; CF di 16 caratteri per ditte individuali
# e persone fisiche (altrimenti scarto 00300). Va anche nel nome file IT<id>_50A.xml.
# ultimo_af_iniziale: ultimo numero emesso PRIMA di usare il programma (dal portale ADE).
